services:
  postgres:
    image: postgres:16-alpine
    container_name: vagas-postgres
    environment:
      POSTGRES_DB: vagas_db
      POSTGRES_USER: vagas_user
      POSTGRES_PASSWORD: vagas_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagas_user -d vagas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: vagas-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vagas_db
      SPRING_DATASOURCE_USERNAME: vagas_user
      SPRING_DATASOURCE_PASSWORD: vagas_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: vagas-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: